server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Reached only through the shell's proxy, so redirects must be relative — an absolute
    # one carries this server's own http://…:80 identity (wrong scheme, wrong port).
    # `$uri/` dropped: in a SPA it only ever produced directory redirects.
    absolute_redirect off;
    port_in_redirect  off;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}