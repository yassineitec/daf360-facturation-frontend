<!-- Sidebar — daf-side-nav owns its own responsive behaviour (fixed left rail
     on desktop, fixed bottom bar on mobile), so no custom drawer/hamburger here. -->
<daf-side-nav
  [items]="navItems()"
  [config]="sideNavConfig"
  [activeRoute]="activeRoute()"
  (itemClick)="onNavClick($event)" />

<main class="shell-content">
  <div class="currency-bar">
    <span class="currency-bar__label">Devise</span>
    @for (c of currencies; track c) {
      <button class="curr-chip" [class.curr-chip--active]="currSvc.selectedCurrency() === c" (click)="currSvc.setCurrency(c)">{{ c }}</button>
    }
  </div>
  <router-outlet />
</main>
