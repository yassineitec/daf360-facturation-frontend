<!-- Sidebar — daf-side-nav owns its own responsive behaviour (fixed left rail
     on desktop, fixed bottom bar on mobile), so no custom drawer/hamburger here. -->
<daf-side-nav
  [items]="navItems()"
  [config]="sideNavConfig"
  [activeRoute]="activeRoute()"
  (itemClick)="onNavClick($event)" />

<main class="shell-content">
  <router-outlet />
</main>

<!-- Display-currency switcher. At the shell root, not inside <main>: it is
     position: fixed, and an ancestor with a transform/filter/backdrop-filter would
     become its containing block and pin it to that box instead of the viewport. -->
<app-currency-switcher />
