<div class="flex flex-col gap-1.5 w-auto">

  @if (label()) {
    <label class="text-label-md font-medium text-on-surface">{{ label() }}</label>
  }

  <div class="relative">

    <button type="button" [class]="triggerClasses()" (click)="toggleOpen()">

      @if (selectedOption(); as opt) {
        <img class="flag-swatch" [src]="flagDataUri(opt.isoCode)" [alt]="opt.isoCode" />
        <span class="flex-1 truncate text-on-surface text-body-md text-left">{{ opt.label }}</span>
      } @else {
        <span class="flex-1 text-on-surface-variant/50 text-body-md text-left">{{ placeholder() }}</span>
      }

      <span
        class="material-symbols-outlined text-on-surface-variant text-label-md
               transition-transform duration-200"
        [class.rotate-180]="open()">
        expand_more
      </span>
    </button>

    @if (open()) {
      <div
        class="absolute z-9999 mt-1 min-w-full w-max max-w-[90vw]
               bg-surface-container-lowest rounded-lg border border-outline-variant
               shadow-xl overflow-hidden"
        (click)="$event.stopPropagation()">

        @if (searchable()) {
          <div class="p-1.5 border-b border-outline-variant">
            <input
              [ngModel]="searchQuery()"
              (ngModelChange)="searchQuery.set($event)"
              placeholder="Rechercher..."
              class="w-full px-2.5 py-1.5 text-body-md leading-5 rounded-md
                     bg-surface-container-low border border-outline-variant
                     focus:outline-none focus:border-tertiary
                     placeholder:text-on-surface-variant/50" />
          </div>
        }

        <ul class="max-h-64 overflow-y-auto py-1">
          @for (opt of filteredOptions(); track opt.value) {
            <li [class]="optionClasses(opt)" (click)="selectOption(opt)">

              <img class="flag-swatch" [src]="flagDataUri(opt.isoCode)" [alt]="opt.isoCode" />
              <span class="flex-1 min-w-0 truncate">{{ opt.label }}</span>

              @if (opt.value === selected()[0]) {
                <span class="material-symbols-outlined text-teal text-label-sm shrink-0">
                  check
                </span>
              }

            </li>
          } @empty {
            <li class="px-2.5 py-1.5 text-body-sm leading-5 text-on-surface-variant text-center">
              Aucun résultat
            </li>
          }
        </ul>

      </div>
    }

  </div>

</div>
