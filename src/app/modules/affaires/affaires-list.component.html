<daf-page [loading]="firstLoad()" [loadingLabel]="'AFFAIRES.LIST.LOADING' | translate">

  <daf-page-header
    [title]="'AFFAIRES.LIST.TITLE' | translate"
    [subtitle]="'AFFAIRES.LIST.SUBTITLE' | translate">
    <daf-button pageActions
      [options]="{ variant: 'teal', label: 'AFFAIRES.LIST.NEW_BTN' | translate, iconStart: 'add' }"
      (onClick)="openNewForm()" />
  </daf-page-header>

  <!-- KPIs — one row, never wraps -->
  <section class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'AFFAIRES.LIST.KPI.ACTIVE' | translate"
      [value]="statsActives()"
      [delta]="kpiDelta()"
      [options]="kpiActive" />

    <daf-metric-card
      [label]="'AFFAIRES.LIST.KPI.RAF' | translate"
      [value]="statsRafTotal() | displayCurrency : 'TND'"
      [delta]="kpiDelta()"
      [options]="kpiRaf" />

    <daf-metric-card
      [label]="'AFFAIRES.LIST.KPI.BUDGET' | translate"
      [value]="statsBudgetTotal() | displayCurrency : 'TND'"
      [delta]="kpiDelta()"
      [options]="kpiBudget" />

    <daf-metric-card
      [label]="'AFFAIRES.LIST.KPI.PENDING' | translate"
      [value]="statsSuspendu()"
      [delta]="kpiDelta()"
      [options]="kpiPending" />
  </section>

  <!-- Search + filters + view toggle -->
  <daf-search-toolbar
    [placeholder]="'AFFAIRES.LIST.TABLE.SEARCH' | translate"
    [value]="searchText()"
    [debounce]="300"
    (valueChange)="onSearchTextChange($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))" />

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() }}
    </div>
  }

  <!-- Content sits free in the page — no outer container card -->
  @if (viewMode() === 'grid') {
    <app-affaires-cards-section
      [affaires]="affaires()"
      [loading]="loading()"
      [skeletonCount]="pageSize()"
      [emptyMessage]="'AFFAIRES.LIST.TABLE.EMPTY' | translate"
      (open)="navigateToDetail($event)" />
  } @else {
    <app-affaires-table-section
      [affaires]="affaires()"
      [loading]="loading()"
      [pageSize]="pageSize()"
      [emptyMessage]="'AFFAIRES.LIST.TABLE.EMPTY' | translate"
      (open)="navigateToDetail($event)" />
  }

  <daf-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    [perPageLabel]="'COMMON.PAGINATION.PER_PAGE' | translate"
    [summaryLabel]="'COMMON.PAGINATION.SUMMARY' | translate"
    [firstPageLabel]="'COMMON.PAGINATION.FIRST' | translate"
    [lastPageLabel]="'COMMON.PAGINATION.LAST' | translate"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSize($event)" />

</daf-page>
