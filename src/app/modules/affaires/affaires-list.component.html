<daf-page [loading]="firstLoad()" [loadingLabel]="'AFFAIRES.LIST.LOADING' | translate">

  <daf-page-header
    [title]="'AFFAIRES.LIST.TITLE' | translate"
    [subtitle]="'AFFAIRES.LIST.SUBTITLE' | translate">
    <daf-button pageActions data-guide="affaires-new"
      [options]="{ variant: 'teal', label: 'AFFAIRES.LIST.NEW_BTN' | translate, iconStart: 'add' }"
      (onClick)="openNewForm()" />
  </daf-page-header>

  <!-- KPIs — une rangée de 7 dès xl, 4 puis 2 colonnes en dessous. -->
  <!-- « Projets actifs », puis les six tuiles de la fiche affaire (vue générale : Backlog,
       Total facturé, Total encaissé, WIP restant, Budget TS, Revenue), sommées sur tout le
       jeu filtré. -->
  <section data-guide="affaires-kpis" class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-2 sm:gap-4">
    <daf-metric-card
      [label]="'AFFAIRES.LIST.KPI.ACTIVE' | translate"
      [value]="statsActives()"
      [delta]="kpiDelta()"
      [options]="kpiActive" />

    @for (k of overviewKpis(); track k.label) {
      <daf-metric-card
        [label]="k.label | translate"
        [value]="k.value | displayCurrency : summaryCurrency()"
        [delta]="k.delta"
        [options]="k.options" />
    }
  </section>

  <!-- Search + filters + view toggle -->
  <daf-search-toolbar data-guide="affaires-toolbar"
    [placeholder]="'AFFAIRES.LIST.TABLE.SEARCH' | translate"
    [value]="searchText()"
    [debounce]="300"
    (valueChange)="onSearchTextChange($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))"
    [table]="tableSection()?.table() ?? null">
    <!-- Projeté par la toolbar juste à gauche de « Filtres ». Exporte toutes les affaires
         filtrées, pas seulement la page. -->
    <daf-button data-guide="affaires-export"
      [options]="{ variant: 'ghost', label: ('AFFAIRES.LIST.EXPORT_EXCEL' | translate), iconStart: 'download',
                   disabled: !totalElements(), loading: exporting() }"
      (onClick)="exportExcel()" />
  </daf-search-toolbar>

  <!-- Bandeau de contexte quand la liste est restreinte à un client (arrivée depuis sa
       fiche) : sans lui, l'utilisateur verrait une liste amputée sans savoir pourquoi. -->
  @if (filterClientId()) {
    <div class="flex flex-wrap items-center gap-3 rounded-xl bg-primary/10 px-4 py-3 text-body-md text-on-surface">
      <span class="material-symbols-outlined text-headline-lg text-primary">filter_alt</span>
      <span>{{ 'AFFAIRES.LIST.CLIENT_FILTER' | translate: { client: clientName() ?? ('AFFAIRES.LIST.CLIENT_FILTER_FALLBACK' | translate) } }}</span>
      <daf-button
        [options]="{ variant: 'ghost', size: 'sm', iconStart: 'close',
                     label: 'AFFAIRES.LIST.CLIENT_FILTER_CLEAR' | translate }"
        (onClick)="clearClientFilter()" />
    </div>
  }

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() }}
    </div>
  }

  <!-- Content sits free in the page — no outer container card -->
  @if (viewMode() === 'grid') {
    <app-affaires-cards-section data-guide="affaires-list"
      [affaires]="affaires()"
      [paysLabels]="paysLabels()"
      [loading]="loading()"
      [skeletonCount]="pageSize()"
      [emptyMessage]="'AFFAIRES.LIST.TABLE.EMPTY' | translate"
      [canDelete]="canDelete()"
      (open)="navigateToDetail($event)"
      (remove)="confirmDelete($event)" />
  } @else {
    <app-affaires-table-section data-guide="affaires-list"
      [affaires]="affaires()"
      [avatarUrls]="avatarUrls()"
      [paysLabels]="paysLabels()"
      [loading]="loading()"
      [pageSize]="pageSize()"
      [emptyMessage]="'AFFAIRES.LIST.TABLE.EMPTY' | translate"
      [sort]="sort()"
      [canDelete]="canDelete()"
      (sortChange)="onSortChange($event)"
      (open)="navigateToDetail($event)"
      (remove)="confirmDelete($event)" />
  }

  <daf-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    [perPageLabel]="'COMMON.PAGINATION.PER_PAGE' | translate"
    [summaryLabel]="'COMMON.PAGINATION.SUMMARY' | translate"
    [firstPageLabel]="'COMMON.PAGINATION.FIRST' | translate"
    [lastPageLabel]="'COMMON.PAGINATION.LAST' | translate"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSize($event)" />

</daf-page>

<!-- Guide de la page, lancé par « Aide & guides » ou la bulle « Première visite ? ». Les étapes
     visent les data-guide ci-dessus ; « affaires-list » est sur les deux vues, seule la visible compte. -->
<app-page-guide storageKey="affaires" [steps]="guideSteps" />
