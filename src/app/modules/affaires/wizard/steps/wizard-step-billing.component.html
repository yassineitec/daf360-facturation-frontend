<div class="step-form">

  @if (locked) {
    <div class="locked-notice">
      <span class="material-symbols-outlined">lock</span>
      {{ 'AFFAIRES.wizard.billing.locked' | translate }}
    </div>
  }

  @if (draft.billingMode) {
    <div class="mode-config">
      <div class="mode-config-header">
        <span class="material-symbols-outlined">tune</span>
        <!-- Le code du mode (« AV ») ne dit rien à qui n'a pas la table en tête : c'est le
             libellé métier qui est affiché, le code ne survit que dans le brouillon. -->
        {{ 'AFFAIRES.wizard.billing.config' | translate:{ mode: (modeConfigKey() | translate) } }}
      </div>

      <!-- `locked` (affaire activée) verrouille le MODE, pas sa configuration : les
           sous-étapes restent modifiables et l'étape 3 est enregistrée en édition. -->
      @switch (draft.billingMode) {
        @case ('FORFAIT') {
          <app-wizard-step-av
            [draft]="draft"
            (draftChange)="onSubDraftChange($event)">
          </app-wizard-step-av>
        }
        @case ('REGIE') {
          <app-wizard-step-tm
            [draft]="draft"
            (draftChange)="onSubDraftChange($event)">
          </app-wizard-step-tm>
        }
        @case ('LIVRABLE') {
          <app-wizard-step-livrable
            [draft]="draft"
            (draftChange)="onSubDraftChange($event)">
          </app-wizard-step-livrable>
        }
      }
    </div>
  }

</div>
