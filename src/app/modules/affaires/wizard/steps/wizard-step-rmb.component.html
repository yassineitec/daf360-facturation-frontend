<div class="step-form">

  <div class="info-banner">
    <span class="material-symbols-outlined" style="font-size:18px">info</span>
    <p class="m-0">
      {{ 'AFFAIRES.wizard.rmb.info' | translate }}
    </p>
  </div>

  <div class="categories-section">
    <div class="section-header">
      <span class="material-symbols-outlined section-icon" style="font-variation-settings:'FILL' 1">payments</span>
      <div>
        <p class="section-title">{{ 'AFFAIRES.wizard.rmb.title' | translate }}</p>
        <p class="section-sub">{{ 'AFFAIRES.wizard.rmb.sub' | translate }}</p>
      </div>
    </div>
    <div class="category-list">
      @for (cat of expenseCategories(); track cat.id) {
        <label class="category-item">
          <input type="checkbox"
            [checked]="draft.eligibleExpenseCategoryIds.includes(cat.id)"
            (change)="toggleCategory(cat.id, $any($event.target).checked)"
            class="category-checkbox" />
          <div class="category-icon-wrap">
            <span class="material-symbols-outlined" style="font-size:20px;font-variation-settings:'FILL' 1">
              {{ getCategoryIcon(cat.code) }}
            </span>
          </div>
          <span class="category-name">{{ cat.labelFr }}</span>
        </label>
      }
      @if (expenseCategories().length === 0) {
        <p class="empty-msg">{{ 'AFFAIRES.wizard.rmb.loading' | translate }}</p>
      }
    </div>
  </div>

</div>
