<daf-page [loading]="firstLoad()" [loadingLabel]="'CLIENTS.LIST.LOADING' | translate">

  <daf-page-header
    [title]="'CLIENTS.LIST.TITLE' | translate"
    [subtitle]="'CLIENTS.LIST.SUBTITLE' | translate">
    <!-- La création exige `FACT_MANAGE_INVOICING` côté API : sans cette garde, un compte
         en lecture seule voyait le bouton et n'apprenait son refus qu'après avoir rempli
         les trois étapes de l'assistant. -->
    <daf-button pageActions *appHasPermission="'FACT_MANAGE_INVOICING'"
      [options]="{ variant: 'teal', label: 'CLIENTS.LIST.NEW_BTN' | translate, iconStart: 'add' }"
      (onClick)="goToNewClient()" />
  </daf-page-header>

  <!-- KPIs — one row, never wraps -->
  <section class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'CLIENTS.LIST.KPI.TOTAL' | translate"
      [value]="statsTotal()"
      [delta]="deltaAllCountries()"
      [options]="kpiTotal" />

    <daf-metric-card
      [label]="'CLIENTS.LIST.KPI.KYC_DONE' | translate"
      [value]="statsKycPct() + '%'"
      [delta]="deltaKyc()"
      [options]="kpiKyc" />

    <daf-metric-card
      [label]="'CLIENTS.LIST.KPI.TOTAL_CA' | translate"
      [value]="statsTotalCA() | displayCurrency : 'TND'"
      [delta]="deltaCurrentPage()"
      [options]="kpiCa" />

    <daf-metric-card
      [label]="'CLIENTS.LIST.KPI.ACTIVE' | translate"
      [value]="statsActive()"
      [delta]="deltaCurrentPage()"
      [options]="kpiActive" />
  </section>

  <!-- Search + filters + view toggle -->
  <daf-search-toolbar
    [placeholder]="'CLIENTS.LIST.SEARCH' | translate"
    [value]="searchText()"
    [debounce]="300"
    (valueChange)="onSearchTextChange($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))" />

  <!-- `daf-field-message` : la ligne de message de la lib, la même sur toutes les pages. -->
  @if (error(); as err) {
    <daf-field-message [error]="err" />
  }

  <!-- Content sits free in the page — no outer container card -->
  @if (viewMode() === 'grid') {
    <app-clients-cards-section
      [clients]="clients()"
      [loading]="loading()"
      [skeletonCount]="pageSize()"
      [emptyTitle]="'CLIENTS.LIST.EMPTY.TITLE' | translate"
      [emptyDescription]="'CLIENTS.LIST.EMPTY.DESC' | translate"
      (open)="navigateToDetail($event)" />
  } @else {
    <app-clients-table-section
      [clients]="clients()"
      [loading]="loading()"
      [pageSize]="pageSize()"
      [emptyMessage]="'CLIENTS.LIST.EMPTY.TITLE' | translate"
      (open)="navigateToDetail($event)" />
  }

  <daf-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    [perPageLabel]="'COMMON.PAGINATION.PER_PAGE' | translate"
    [summaryLabel]="'COMMON.PAGINATION.SUMMARY' | translate"
    [firstPageLabel]="'COMMON.PAGINATION.FIRST' | translate"
    [lastPageLabel]="'COMMON.PAGINATION.LAST' | translate"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSize($event)" />

</daf-page>
