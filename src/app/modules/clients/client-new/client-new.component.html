<!-- Assistant « Nouveau client » — même squelette que l'assistant d'affaire :
     `daf-page` porte le rythme vertical, `daf-page-header` le h1, le fil d'Ariane et le
     résumé de la saisie en pastilles, et la barre d'actions du bas porte la progression.
     Plus de `.wizard-page` / `.page-head` / `.sidebar` maison.

     La barre est `sticky` et vit DANS `daf-page` : le conteneur de défilement est
     `.shell-content`, qui porte la marge de la barre latérale ; une barre `fixed` se
     calerait sur la fenêtre et se retrouverait décentrée par rapport au formulaire. -->

<daf-page [kpis]="0" [breadcrumbs]="true">

  <daf-page-header
    [title]="'CLIENTS.NEW.TITLE' | translate"
    [subtitle]="pageSubtitle()"
    [badges]="headerBadges()"
    [breadcrumbs]="breadcrumbs()"
    [breadcrumbLabel]="'CLIENTS.NEW.BREADCRUMB_ARIA' | translate" />

  <div style="display:flex; flex-direction:column; gap:1rem">

    <div class="form-card">

      <!-- Titre de l'étape courante -->
      <div class="card-head">
        <div class="card-head__icon">
          <span class="material-symbols-outlined">{{ steps()[currentStep() - 1].icon }}</span>
        </div>
        <div>
          <h2 class="card-head__title">{{ steps()[currentStep() - 1].title }}</h2>
          <p class="card-head__sub">
            {{ 'CLIENTS.NEW.STEP_COUNTER' | translate:{ current: currentStep(), total: steps().length } }}
          </p>
        </div>
      </div>

      <div class="step-body">
        <app-client-form
          #formRef
          [paysId]="paysId()"
          [activeSection]="currentStep()"
          (saved)="onSaved($event)"
          (closed)="goBack()" />
      </div>

      @if (!canGoNext() && currentStep() === 1) {
        <div class="validation-hint">
          <span class="material-symbols-outlined">info</span>
          <span>{{ stepValidationError() }}</span>
        </div>
      }

    </div><!-- /form-card -->

  </div>

  <!-- ══════════════════════════════════════════════════════════════════════
       BARRE D'ACTIONS — progression + navigation, comme l'assistant d'affaire.
       `daf-stepper` en `chrome: 'header-only'` : le rail seul, la navigation
       reste à nous.
       ══════════════════════════════════════════════════════════════════ -->
  <div class="action-bar rounded-xl border border-outline-variant bg-surface-container-lowest
              p-4 shadow-[0_-4px_24px_rgba(0,0,0,0.12)]"
       style="position:sticky; bottom:1rem; z-index:40; display:flex; flex-wrap:wrap;
              align-items:center; justify-content:space-between; gap:1rem">

    <div style="flex:1 1 320px; min-width:0">
      <daf-stepper
        orientation="horizontal"
        [steps]="stepperSteps()"
        [currentStep]="currentStep() - 1"
        [config]="stepperConfig()"
        (stepClick)="onStepClick($event)" />
    </div>

    <div style="display:flex; flex-shrink:0; align-items:center; gap:0.5rem">
      @if (currentStep() > 1) {
        <daf-button
          [options]="{ variant: 'ghost', pill: true, iconStart: 'arrow_back',
                       label: 'CLIENTS.NEW.PREV' | translate }"
          (onClick)="goPrev()" />
      } @else {
        <daf-button
          [options]="{ variant: 'ghost', pill: true, iconStart: 'close',
                       label: 'CLIENTS.NEW.CANCEL' | translate }"
          (onClick)="goBack()" />
      }
      <daf-button [options]="nextButtonOptions()" (onClick)="goNext()" />
    </div>

  </div>

</daf-page>
