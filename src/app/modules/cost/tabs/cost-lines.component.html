<div class="flex flex-col gap-8">

  <!-- KPIs — counted over the page on screen, which is what the list endpoint returns -->
  <section class="grid grid-cols-3 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'COST.LINES.KPI_DRAFTS' | translate"
      [value]="draftCount()"
      [options]="kpiDrafts" />
    <daf-metric-card
      [label]="'COST.LINES.KPI_PENDING' | translate"
      [value]="pendingCount()"
      [options]="kpiPending" />
    <daf-metric-card
      [label]="'COST.LINES.KPI_APPROVED' | translate"
      [value]="approvedCount()"
      [options]="kpiApproved" />
  </section>

  <!-- Search + status filter + view toggle. The status filter re-fetches (the endpoint
       takes it); the search is a projection of the loaded page. -->
  <daf-search-toolbar
    [placeholder]="'COST.LINES.SEARCH_PLACEHOLDER' | translate"
    [value]="searchText()"
    [debounce]="200"
    (valueChange)="searchText.set($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))">
    <daf-button
      [options]="{ variant: 'teal', label: 'COST.LINES.NEW_LINE' | translate, iconStart: 'add' }"
      (onClick)="openCreate()" />
  </daf-search-toolbar>

  @if (serverError() || actionError()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ serverError() ?? actionError() }}
    </div>
  }

  <!-- Content sits free in the page — no outer container card -->
  @if (viewMode() === 'grid') {
    <app-cost-lines-cards-section
      [lines]="visibleLines()"
      [categoryFor]="categoryFor"
      [loading]="isLoading()"
      [skeletonCount]="size()"
      [emptyMessage]="'COST.LINES.TABLE_EMPTY' | translate"
      (edit)="openEdit($event)"
      (submitLine)="submitLine($event)" />
  } @else {
    <app-cost-lines-table-section
      [lines]="visibleLines()"
      [categoryFor]="categoryFor"
      [loading]="isLoading()"
      [pageSize]="size()"
      [emptyMessage]="'COST.LINES.TABLE_EMPTY' | translate"
      (edit)="openEdit($event)"
      (submitLine)="submitLine($event)" />
  }

  <daf-pagination
    [currentPage]="page()"
    [totalPages]="totalPagesCount()"
    [totalElements]="total()"
    [pageSize]="size()"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [perPageLabel]="'COMMON.PAGINATION.PER_PAGE' | translate"
    [summaryLabel]="'COMMON.PAGINATION.SUMMARY' | translate"
    [firstPageLabel]="'COMMON.PAGINATION.FIRST' | translate"
    [lastPageLabel]="'COMMON.PAGINATION.LAST' | translate"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSize($event)" />

</div>
