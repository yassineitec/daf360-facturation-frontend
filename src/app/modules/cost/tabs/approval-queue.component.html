<div class="flex flex-col gap-8">

  <!-- KPIs — the queue arrives in one call, so these count the whole queue -->
  <section class="grid grid-cols-2 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'COST.QUEUE.KPI_PENDING' | translate"
      [value]="pendingCount()"
      [options]="kpiPending" />
    <daf-metric-card
      [label]="'COST.QUEUE.KPI_URGENT' | translate"
      [value]="urgentCount()"
      [options]="kpiUrgent" />
  </section>

  <!-- Search is a projection of the queue already on screen; the refresh action
       re-fetches it. -->
  <daf-search-toolbar
    [placeholder]="'COST.QUEUE.SEARCH_PLACEHOLDER' | translate"
    [value]="searchQuery()"
    [debounce]="200"
    (valueChange)="searchQuery.set($event)"
    [actions]="toolbarActions()"
    (action)="onToolbarAction($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))" />

  @if (serverError()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ serverError() }}
    </div>
  }

  @if (viewMode() === 'grid') {
    <app-approval-queue-cards-section
      [pending]="filteredPending()"
      [loading]="isLoading()"
      [emptyMessage]="'COST.QUEUE.EMPTY' | translate"
      (approve)="openModal($event, 'approve')"
      (returnLine)="openModal($event, 'return')"
      (reject)="openModal($event, 'reject')" />
  } @else {
    <app-approval-queue-table-section
      [pending]="filteredPending()"
      [loading]="isLoading()"
      [emptyMessage]="'COST.QUEUE.EMPTY' | translate"
      (approve)="openModal($event, 'approve')"
      (returnLine)="openModal($event, 'return')"
      (reject)="openModal($event, 'reject')" />
  }

</div>

<!-- Modal at the root, outside any glass card (§10e) -->
@if (modalLine()) {
  <app-approve-modal
    [costLine]="modalLine()!"
    [action]="modalAction()"
    [level]="modalLevel()"
    (closed)="closeModal()"
    (resolved)="onResolved()" />
}
