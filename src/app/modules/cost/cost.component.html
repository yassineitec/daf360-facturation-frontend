<daf-page [kpis]="0" [loadingLabel]="'COST.PAGE.TITLE' | translate">

  <!-- Boutons à droite du titre, comme sur les autres pages : déclarés par app-cost-lines
       (#pageActions), qui porte l'état dont ils dépendent (export, création). -->
  <daf-page-header
    [title]="'COST.PAGE.TITLE' | translate"
    [subtitle]="'COST.PAGE.SUBTITLE' | translate">
    <ng-container pageActions [ngTemplateOutlet]="lines()?.pageActions() ?? null" />
  </daf-page-header>

  <app-cost-lines />

</daf-page>

<!-- Guide de la page, lancé par « Aide & guides » ou la bulle « Première visite ? ». Ses étapes
     visent les data-guide de app-cost-lines ; « cost-list » est sur les trois vues, seule la visible compte. -->
<app-page-guide storageKey="costs" [steps]="guideSteps" />
