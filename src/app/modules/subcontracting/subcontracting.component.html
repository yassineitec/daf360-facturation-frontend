<daf-page [loading]="firstLoad()" [kpis]="0" [loadingLabel]="'SUBCONTRACTING.TITLE' | translate">

  <daf-page-header
    [title]="'SUBCONTRACTING.TITLE' | translate"
    [subtitle]="'SUBCONTRACTING.SUBTITLE' | translate">
    <!-- ng-container is the static root: an element inside a structural directive or
         @if lives in an embedded view, where <ng-content select="[pageActions]"> can
         never match it (§10f). -->
    <!-- The entity selector scopes the SUBCONTRACTORS DIRECTORY ONLY — the other two
         tabs are affaire-scoped and ignore it. Showing it on all three made it read as
         a page-wide filter that silently governed a third of the page. -->
    <ng-container pageActions>
      @if (activeTab() === 'st' && pays().length > 0) {
        <daf-select
          [options]="paysOptions()"
          [config]="{ label: ('SUBCONTRACTING.ENTITY' | translate), searchable: true }"
          [selected]="paysSelected()"
          (selectedChange)="onPaysSelect($event)" />
      }
    </ng-container>
  </daf-page-header>

  <!-- daf-tabs is strip-only — the consumer renders the panel, which is what keeps the
       per-tab work in this page. Active tab lives in ?tab= (§10f). -->
  <daf-tabs #tabsRef
    [tabs]="tabs()"
    [active]="activeTab()"
    (activeChange)="onTabChange($event)"
    idPrefix="sc" />

  <div role="tabpanel"
       [id]="tabsRef.panelId(activeTab())"
       [attr.aria-labelledby]="tabsRef.tabId(activeTab())"
       class="flex flex-col gap-8">

    <!-- One line per tab saying what it holds and what scopes it. The three tabs are
         three different levels (vendor directory → order on a project → margin on a
         project) and nothing on screen used to say so. -->
    <p class="flex items-start gap-2 rounded-xl bg-surface-container-low px-4 py-3
              text-body-sm text-on-surface-variant">
      <span class="material-symbols-outlined text-[18px] text-outline">info</span>
      {{ tabIntro() }}
    </p>

    @switch (activeTab()) {
      @case ('st')     { <app-sous-traitants-tab [paysId]="selectedPaysId()" /> }
      @case ('ordres') { <app-ordres-st-tab      [paysId]="selectedPaysId()" /> }
      @default         { <app-couts-analyse-tab /> }
    }
  </div>

</daf-page>
