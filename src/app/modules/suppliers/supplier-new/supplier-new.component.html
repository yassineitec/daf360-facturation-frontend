<!-- Assistant « Nouveau fournisseur » — même squelette que les assistants facture,
     affaire et client : `daf-page` porte le rythme vertical, `daf-page-header` le h1, le
     fil d'Ariane et le résumé de la saisie en pastilles, et la barre d'actions du bas
     porte la progression. Plus de `.wizard-page` / `.page-head` / `.sidebar` maison.

     La barre est `sticky` et vit DANS `daf-page` : le conteneur de défilement est
     `.shell-content`, qui porte la marge de la barre latérale ; une barre `fixed` se
     calerait sur la fenêtre et se retrouverait décentrée par rapport au formulaire. -->

<daf-page [kpis]="0" [breadcrumbs]="true" [loading]="loading()"
          [loadingLabel]="'SUPPLIERS.EDIT.LOADING' | translate">

  <daf-page-header
    [title]="pageTitle()"
    [subtitle]="pageSubtitle()"
    [badges]="headerBadges()"
    [breadcrumbs]="breadcrumbs()"
    [breadcrumbLabel]="'SUPPLIERS.NEW.BREADCRUMB_ARIA' | translate" />

  <!-- Les erreurs vivent AU-DESSUS de la carte, pas dans l'étape 3 : en modification,
       un échec de chargement survient avant que l'utilisateur n'atteigne la dernière
       étape, et une erreur d'unicité de TVA porte sur un champ de l'étape 2. -->
  @if (saveError(); as err) {
    <daf-field-message [error]="err" />
  }

  <div class="form-card">

    <!-- Titre de l'étape courante -->
    <div class="card-head">
      <div class="card-head__icon">
        <span class="material-symbols-outlined">{{ stepIcon() }}</span>
      </div>
      <div>
        <h2 class="card-head__title">{{ stepTitle() }}</h2>
        <p class="card-head__sub">{{ stepSub() }}</p>
      </div>
    </div>

    <div class="step-body">

      <!-- ── Étape 1 — Identification ─────────────────────────────────── -->
      @if (step() === 1) {
        <div style="display:flex; flex-direction:column; gap:1.25rem">

          <daf-form-field
            [value]="name()"
            (valueChange)="name.set($any($event) ?? '')"
            [options]="{
              label: ('SUPPLIERS.NEW.COMPANY_NAME' | translate),
              placeholder: ('SUPPLIERS.NEW.COMPANY_NAME_PLACEHOLDER' | translate),
              required: true,
              maxLength: 200,
              fullWidth: true,
              error: touched() && !name().trim() ? ('SUPPLIERS.NEW.REQUIRED' | translate) : undefined
            }" />

          <!-- `searchable` : la liste des pays de référence se compte en dizaines, un
               `<select>` natif obligeait à la parcourir au clavier.

               Verrouillé en modification : le préfixe du `code` déjà attribué en
               dépend, et le serveur ignore `paysId` sur le PATCH. Le champ reste
               VISIBLE — savoir de quel pays dépend le fournisseur qu'on modifie fait
               partie du contexte — mais il est désactivé et le dit. -->
          <daf-select
            [options]="paysSelectOptions()"
            [selected]="selectedPaysValue()"
            (selectedChange)="onPaysSelect($event)"
            [config]="{
              label: ('SUPPLIERS.NEW.COUNTRY' | translate),
              placeholder: ('SUPPLIERS.NEW.COUNTRY_SELECT' | translate),
              required: true,
              searchable: !isEdit,
              disabled: isEdit,
              hint: isEdit ? ('SUPPLIERS.EDIT.PAYS_LOCKED' | translate) : undefined,
              error: touched() && !paysId() ? ('SUPPLIERS.NEW.REQUIRED' | translate) : undefined
            }" />

          <daf-select
            [options]="typeSelectOptions()"
            [selected]="selectedTypeValue()"
            (selectedChange)="onTypeSelect($event)"
            [config]="{
              label: ('SUPPLIERS.NEW.SUPPLIER_TYPE' | translate),
              placeholder: ('SUPPLIERS.NEW.SUPPLIER_TYPE_SELECT' | translate),
              required: true,
              error: touched() && typeId() === null ? ('SUPPLIERS.NEW.REQUIRED' | translate) : undefined
            }" />

        </div>
      }

      <!-- ── Étape 2 — Informations fiscales ──────────────────────────── -->
      @if (step() === 2) {
        <div style="display:flex; flex-direction:column; gap:1.25rem">

          <daf-form-field
            [value]="numeroTva()"
            (valueChange)="numeroTva.set($any($event) ?? '')"
            [options]="{
              label: ('SUPPLIERS.NEW.TVA' | translate),
              placeholder: ('SUPPLIERS.NEW.TVA_PLACEHOLDER' | translate),
              hint: ('SUPPLIERS.NEW.TVA_HINT' | translate),
              maxLength: 50,
              fullWidth: true
            }" />

          <daf-form-field
            [value]="taxId()"
            (valueChange)="taxId.set($any($event) ?? '')"
            [options]="{
              label: ('SUPPLIERS.NEW.TAX_ID' | translate),
              placeholder: ('SUPPLIERS.NEW.TAX_ID_PLACEHOLDER' | translate),
              maxLength: 50,
              fullWidth: true
            }" />

        </div>
      }

      <!-- ── Étape 3 — Coordonnées bancaires ──────────────────────────── -->
      @if (step() === 3) {
        <div style="display:flex; flex-direction:column; gap:1.25rem">

          <daf-form-field
            [value]="iban()"
            (valueChange)="iban.set($any($event) ?? '')"
            [options]="{
              label: ('SUPPLIERS.NEW.IBAN' | translate),
              placeholder: ('SUPPLIERS.NEW.IBAN_PLACEHOLDER' | translate),
              hint: ('SUPPLIERS.NEW.IBAN_HINT' | translate),
              maxLength: 34,
              fullWidth: true
            }" />

        </div>
      }

    </div>

  </div><!-- /form-card -->


  <!-- ══════════════════════════════════════════════════════════════════════
       BARRE D'ACTIONS — même barre que l'assistant affaire, à l'identique et
       volontairement : Retour — rail — action affirmative, dans une `daf-card`
       `variant: 'floating'` (lib 4.19) plutôt que la dalle que ce fichier
       dessinait à la main (bordure + `shadow-[0_-4px_24px_rgba(...)]` littérale).

       `position: sticky` et NON `fixed`, et à l'INTÉRIEUR de daf-page : le
       conteneur de défilement est `.shell-content`, qui porte la marge de la barre
       latérale ; une barre `fixed` se calerait sur la fenêtre et se retrouverait
       décentrée par rapport au formulaire. En `sticky`, elle prend la largeur de la
       colonne de contenu et occupe sa place en fin de flux.

       Une SEULE action dessinée : « Suivant »/« Enregistrer » en teal. Le retour et
       l'annulation sont des actions de TEXTE (`.footer-action`), gris au repos, dont
       le libellé et l'icône passent ensemble en teal au survol — l'icône hérite de
       `currentColor`. Deux boutons dessinés feraient concurrence au rail.
       ══════════════════════════════════════════════════════════════════ -->
  <daf-card class="action-bar" [options]="{ variant: 'floating', radius: 'lg', padding: 'sm' }">
    <div class="action-bar__inner">

      <div class="action-bar__side">
        @if (step() > 1) {
          <button type="button" class="footer-action" (click)="goPrev()">
            <span class="material-symbols-outlined">arrow_back</span>
            {{ 'SUPPLIERS.NEW.BACK' | translate }}
          </button>
        } @else {
          <button type="button" class="footer-action" (click)="cancel()">
            <span class="material-symbols-outlined">close</span>
            {{ 'SUPPLIERS.NEW.CANCEL' | translate }}
          </button>
        }
      </div>

      <!-- Rail : cliquable uniquement sur ce qui a déjà été franchi (cf. onStepClick) -->
      <div class="action-bar__rail">
        <daf-stepper
          orientation="horizontal"
          [steps]="stepperSteps()"
          [currentStep]="step() - 1"
          [config]="stepperConfig()"
          (stepClick)="onStepClick($event)" />
      </div>

      <div class="action-bar__side action-bar__side--end">
        <daf-button [options]="nextButtonOptions()" (onClick)="goNext()" />
      </div>

    </div>
  </daf-card>

</daf-page>
