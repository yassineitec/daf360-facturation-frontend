<daf-page [loading]="firstLoad()" [loadingLabel]="'SUPPLIERS.LIST.LOADING' | translate">

  <daf-page-header
    [title]="'SUPPLIERS.LIST.TITLE' | translate"
    [subtitle]="'SUPPLIERS.LIST.SUBTITLE' | translate">
    <!-- `FACT_MANAGE_COST`, et non `FACT_MANAGE_SUPPLIERS` : c'est le droit que
         `SupplierController` vérifie réellement sur `POST /suppliers`. Le code
         `FACT_MANAGE_SUPPLIERS` existe bien au catalogue mais aucun endpoint ne s'en
         sert — la garde d'origine cachait donc le bouton à des comptes autorisés, et le
         montrait à des comptes qui prenaient un 403 après trois étapes d'assistant. -->
    <daf-button pageActions *appHasPermission="'FACT_MANAGE_COST'"
      [options]="{ variant: 'teal', label: 'SUPPLIERS.LIST.NEW' | translate, iconStart: 'add' }"
      (onClick)="goToNewSupplier()" />
  </daf-page-header>

  <!-- KPIs — une ligne, jamais de retour. Ils décrivent le référentiel ACTIF (c'est tout
       ce que `GET /suppliers` renvoie), pas la page affichée : le premier delta le dit.
       Les deux du milieu mesurent une complétude — sans IBAN on ne peut pas payer, sans
       n° de TVA on ne peut pas déclarer. -->
  <section class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'SUPPLIERS.LIST.KPI.TOTAL' | translate"
      [value]="stats().total"
      [delta]="scopeDelta()"
      [options]="kpiTotal" />

    <daf-metric-card
      [label]="'SUPPLIERS.LIST.KPI.WITH_IBAN' | translate"
      [value]="stats().withIban"
      [delta]="ibanDelta()"
      [options]="kpiIban" />

    <daf-metric-card
      [label]="'SUPPLIERS.LIST.KPI.WITH_TVA' | translate"
      [value]="stats().withTva"
      [delta]="tvaDelta()"
      [options]="kpiTva" />

    <daf-metric-card
      [label]="'SUPPLIERS.LIST.KPI.COUNTRIES' | translate"
      [value]="stats().countries"
      [options]="kpiCountries" />
  </section>

  <!-- Recherche + bascule de vue. Pas de panneau de filtres : `GET /suppliers/search`
       ne prend que `paysId` et `q`, et un filtre qui ne part pas au serveur est un
       contrôle qui ne fait rien (§10b). -->
  <daf-search-toolbar
    [placeholder]="'SUPPLIERS.LIST.SEARCH_PLACEHOLDER' | translate"
    [value]="searchText()"
    [debounce]="300"
    (valueChange)="onSearchTextChange($event)"
    [showFilter]="false"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))" />

  @if (error(); as err) {
    <daf-field-message [error]="err" />
  }


  <!-- Le contenu vit librement dans la page — pas de carte conteneur extérieure -->
  @if (viewMode() === 'grid') {
    <app-suppliers-cards-section
      [suppliers]="suppliers()"
      [loading]="loading()"
      [skeletonCount]="pageSize()"
      [emptyMessage]="'SUPPLIERS.LIST.TABLE.EMPTY' | translate"
      (open)="navigateToDetail($event)" />
  } @else {
    <app-suppliers-table-section
      [suppliers]="suppliers()"
      [loading]="loading()"
      [pageSize]="pageSize()"
      [emptyMessage]="'SUPPLIERS.LIST.TABLE.EMPTY' | translate"
      (open)="navigateToDetail($event)" />
  }

  <daf-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    [perPageLabel]="'COMMON.PAGINATION.PER_PAGE' | translate"
    [summaryLabel]="'COMMON.PAGINATION.SUMMARY' | translate"
    [firstPageLabel]="'COMMON.PAGINATION.FIRST' | translate"
    [lastPageLabel]="'COMMON.PAGINATION.LAST' | translate"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSize($event)" />

</daf-page>
