<daf-page [loading]="firstLoad()" [loadingLabel]="'PAYMENTS.DASHBOARD.LOADING' | translate">

  <daf-page-header
    [title]="'PAYMENTS.DASHBOARD.TITLE' | translate"
    [subtitle]="'PAYMENTS.DASHBOARD.SUBTITLE' | translate">
    <!-- The ng-container is the static root: a structural directive puts its element in
         an embedded view, where <ng-content select="[pageActions]"> can never match it
         and the button silently renders in the page body instead (§10f). -->
    <ng-container pageActions>
      <!-- Désactivé volontairement : le rapprochement bancaire reste hors périmètre du
           recouvrement pour l'instant. Le bouton est laissé visible — il annonce la
           fonction à venir — mais inerte, et `title` dit pourquoi au survol. -->
      <daf-button
        *appHasPermission="'FACT_BANK_RECONCILIATION'"
        [options]="{ variant: 'teal', disabled: true,
                     label: 'PAYMENTS.DASHBOARD.RECON_BTN' | translate,
                     title: 'PAYMENTS.DASHBOARD.RECON_DISABLED' | translate,
                     iconStart: 'account_balance' }" />
    </ng-container>
  </daf-page-header>

  <!-- KPIs — one row, never wraps. These come from /payments/stats and are tenant-wide,
       not page-scoped like the other finance lists.

       Les quatre valeurs sont des MONTANTS, nets des règlements reçus, et le décompte de
       factures passe en `delta`. « En retard » faisait l'inverse — un nombre de factures
       au milieu de trois montants — et « Délai moyen de paiement » a été retiré : il ne
       se calculait que sur les factures soldées, donc il s'améliorait à mesure que
       l'arriéré vieillissait. Sa place revient à la tranche à plus de 90 jours, qui est
       la question que cet écran pose vraiment. -->
  <section class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'PAYMENTS.DASHBOARD.KPI.PENDING' | translate"
      [value]="stats() ? (stats()!.enAttenteMontant | displayCurrency : stats()!.devise) : '—'"
      [options]="kpiPending()" />

    <daf-metric-card
      [label]="'PAYMENTS.DASHBOARD.KPI.OVERDUE' | translate"
      [value]="stats() ? (stats()!.enRetardMontant | displayCurrency : stats()!.devise) : '—'"
      [delta]="overdueDelta()"
      [options]="kpiOverdue()" />

    <daf-metric-card
      [label]="'PAYMENTS.DASHBOARD.KPI.COLLECTED_MONTH' | translate"
      [value]="stats() ? (stats()!.encaisseThisMoisMontant | displayCurrency : stats()!.devise) : '—'"
      [options]="kpiCollected()" />

    <daf-metric-card
      [label]="'PAYMENTS.DASHBOARD.KPI.PLUS_90' | translate"
      [value]="stats() ? (stats()!.plus90Montant | displayCurrency : stats()!.devise) : '—'"
      [delta]="plus90Delta()"
      [options]="kpiPlus90()" />
  </section>

  <!-- Affaire, client, période and the overdue toggle live inside the filter panel.
       La recherche est servie par le serveur (`search` sur GET /payments/aging) et porte
       donc sur tout l'encours de l'entité, numéro de facture ou nom de client. Elle ne
       filtrait auparavant que la page déjà chargée : un client absent de la page courante
       restait introuvable alors qu'il avait des factures en retard. -->
  <daf-search-toolbar
    [placeholder]="'PAYMENTS.DASHBOARD.FILTER.SEARCH_PH' | translate"
    [value]="searchText()"
    [debounce]="300"
    (valueChange)="onSearchTextChange($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))" />

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() }}
    </div>
  }

  <!-- Content sits free in the page — no outer container card -->
  @if (viewMode() === 'grid') {
    <app-aging-cards-section
      [agingRows]="rows()"
      [loading]="loadingRows()"
      [skeletonCount]="pageSize()"
      [emptyMessage]="'PAYMENTS.DASHBOARD.TABLE.EMPTY' | translate"
      (open)="navigateToInvoice($event)" />
  } @else {
    <app-aging-table-section
      [agingRows]="rows()"
      [loading]="loadingRows()"
      [pageSize]="pageSize()"
      [emptyMessage]="'PAYMENTS.DASHBOARD.TABLE.EMPTY' | translate"
      (open)="navigateToInvoice($event)" />
  }

  <daf-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    [perPageLabel]="'COMMON.PAGINATION.PER_PAGE' | translate"
    [summaryLabel]="'COMMON.PAGINATION.SUMMARY' | translate"
    [firstPageLabel]="'COMMON.PAGINATION.FIRST' | translate"
    [lastPageLabel]="'COMMON.PAGINATION.LAST' | translate"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSize($event)" />

</daf-page>
