<daf-page [loading]="firstLoad()" [loadingLabel]="'INVOICING.LIST.LOADING' | translate">

  <daf-page-header
    [title]="'INVOICING.LIST.TITLE' | translate"
    [subtitle]="'INVOICING.LIST.SUBTITLE' | translate">
    <daf-button pageActions
      [options]="{ variant: 'teal', label: 'INVOICING.LIST.NEW_BTN' | translate, iconStart: 'add' }"
      (onClick)="navigateToNew()" />
  </daf-page-header>

  <!-- KPIs — one row, never wraps. Every amount sums the page on screen. -->
  <section class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="'INVOICING.LIST.KPI.TOTAL' | translate"
      [value]="amountTotal() | displayCurrency : 'TND'"
      [delta]="deltaCurrentPage()"
      [options]="kpiTotal" />

    <daf-metric-card
      [label]="'INVOICING.LIST.KPI.PENDING' | translate"
      [value]="amountEnAttente() | displayCurrency : 'TND'"
      [delta]="deltaPending()"
      [options]="kpiPending" />

    <daf-metric-card
      [label]="'INVOICING.LIST.KPI.OVERDUE' | translate"
      [value]="amountEnRetard() | displayCurrency : 'TND'"
      [delta]="deltaOverdue()"
      [options]="kpiOverdue" />

    <daf-metric-card
      [label]="'INVOICING.LIST.KPI.DISPUTED' | translate"
      [value]="amountEnLitige() | displayCurrency : 'TND'"
      [delta]="deltaDisputed()"
      [options]="kpiDisputed" />
  </section>

  <!-- Search + filters (statut and the date range live inside the filter panel) -->
  <daf-search-toolbar
    [placeholder]="'INVOICING.LIST.SEARCH' | translate"
    [value]="searchText()"
    [debounce]="300"
    (valueChange)="onSearchTextChange($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))" />

  @if (error() || actionError()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() ?? actionError() }}
    </div>
  }

  <!-- Content sits free in the page — no outer container card. Both views expose the
       same five outputs, so neither can offer an action the other doesn't. -->
  @if (viewMode() === 'grid') {
    <app-invoices-cards-section
      [invoices]="invoices()"
      [loading]="loading()"
      [skeletonCount]="pageSize()"
      [emptyMessage]="'INVOICING.LIST.TABLE.EMPTY' | translate"
      (open)="navigateToDetail($event)"
      (approve)="openApprovalModal($event)"
      (emitInvoice)="quickEmit($event)"
      (markSent)="quickMarkSent($event)"
      (recordPayment)="openPaymentModal($event)" />
  } @else {
    <app-invoices-table-section
      [invoices]="invoices()"
      [loading]="loading()"
      [pageSize]="pageSize()"
      [emptyMessage]="'INVOICING.LIST.TABLE.EMPTY' | translate"
      (open)="navigateToDetail($event)"
      (approve)="openApprovalModal($event)"
      (emitInvoice)="quickEmit($event)"
      (markSent)="quickMarkSent($event)"
      (recordPayment)="openPaymentModal($event)" />
  }

  <daf-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [totalElements]="totalElements()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[10, 20, 50, 100]"
    [perPageLabel]="'COMMON.PAGINATION.PER_PAGE' | translate"
    [summaryLabel]="'COMMON.PAGINATION.SUMMARY' | translate"
    [firstPageLabel]="'COMMON.PAGINATION.FIRST' | translate"
    [lastPageLabel]="'COMMON.PAGINATION.LAST' | translate"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSize($event)" />

</daf-page>

<!-- Modals live at the page root, outside daf-page: they are position: fixed and a
     glass card ancestor would become their containing block (UI-PLAYBOOK §10e). -->
@if (paymentTarget()) {
  <app-payment-modal [invoice]="paymentTarget()!" (closed)="onPaymentDone($event)" />
}

<!-- Approval modal body — projected into daf-modal by ModalService -->
<ng-template #approvalTpl>
  <div class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <span class="text-label-caps text-outline">
        {{ 'INVOICING.LIST.APPROVAL.DECISION_LABEL' | translate }}
      </span>
      <div class="flex flex-wrap gap-2">
        @for (opt of approvalOptions(); track opt.id) {
          <button type="button"
            class="flex items-center gap-2 rounded-lg border-2 px-4 py-2 text-body-md font-bold transition-all"
            [class]="approvalDecision() === opt.id
              ? 'border-tertiary bg-tertiary/10 text-primary'
              : 'border-outline-variant/40 text-on-surface-variant hover:bg-surface-container'"
            (click)="approvalDecision.set(opt.id)">
            <span class="material-symbols-outlined text-[18px]">{{ opt.icon }}</span>
            {{ opt.label }}
          </button>
        }
      </div>
    </div>

    @if (approvalDecision() !== 'APPROVE') {
      <daf-form-field
        [options]="{ label: ('INVOICING.LIST.APPROVAL.COMMENT_LABEL' | translate), type: 'textarea', rows: 3, placeholder: ('INVOICING.LIST.APPROVAL.COMMENT_PLACEHOLDER' | translate) }"
        [value]="approvalCommentSig()"
        (valueChange)="approvalCommentSig.set($any($event) ?? '')" />
    }
  </div>
</ng-template>
