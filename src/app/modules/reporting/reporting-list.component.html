<!-- `daf-page` carries the background, vertical rhythm and first-load skeleton;
     `daf-page-header` carries the h1. Same skeleton as the other finance list screens. -->
<daf-page [kpis]="4" [loading]="firstLoad()" [loadingLabel]="'REPORTING.TITLE' | translate">

  <daf-page-header
    [title]="'REPORTING.TITLE' | translate"
    [subtitle]="'REPORTING.SUBTITLE' | translate">
    <ng-container pageActions>
      <div class="flex items-center gap-3" data-guide="reporting-actions">
        <!-- No visible label: the flag + country name say it, and a label on top made the
             select taller than the button next to it. -->
        @if (paysList().length > 1) {
          <app-pays-flag-select
            [options]="paysOptions()"
            [selected]="paysId() ? [paysId().toString()] : []"
            [placeholder]="paysSelectPlaceholder()"
            (selectedChange)="onPaysSelected($event)" />
        }
        <!-- One "Actions" menu: the main action (new period, only with FACT_MANAGE_COST)
             first, then the two rarely-used settings screens. -->
        <app-pl-actions-menu
          [label]="'REPORTING.ACTIONS' | translate"
          [items]="actionItems()"
          (itemClick)="onActionItem($event.id)" />
      </div>
    </ng-container>
  </daf-page-header>

  <!-- KPIs — one row, never wraps (same layout as the recouvrement dashboard). Summed
       client-side over the selected pays' CLOSED periods of `kpiYear()`: amounts only
       exist once a period is closed (snapshot), so OPEN months are left out. -->
  <section data-guide="reporting-kpis" class="grid grid-cols-4 gap-2 sm:gap-6">
    <daf-metric-card
      [label]="kpiNetRevenueLabel()"
      [value]="kpiNetRevenueDisplay()"
      [delta]="kpiNetRevenueDelta()"
      [options]="kpiNetRevenueOptions()" />

    <daf-metric-card
      [label]="kpiEbitdaLabel()"
      [value]="kpiEbitdaDisplay()"
      [options]="kpiEbitdaOptions()" />

    <daf-metric-card
      [label]="kpiMarginLabel()"
      [value]="kpiMarginDisplay()"
      [delta]="kpiMarginDelta()"
      [options]="kpiMarginOptions()" />

    <daf-metric-card
      [label]="kpiPendingLabel()"
      [value]="pendingReportsCount().toString()"
      [delta]="kpiPendingDelta()"
      [options]="kpiPendingOptions()" />
  </section>

  <!-- Search on the period label + year / period status / report status in the panel.
       All client-side: the pays' whole period list is already loaded. -->
  <daf-search-toolbar data-guide="reporting-toolbar"
    [placeholder]="'REPORTING.FILTER.SEARCH_PH' | translate"
    [value]="searchText()"
    [debounce]="200"
    (valueChange)="searchText.set($event)"
    [filterFields]="filterFields()"
    [filterConfig]="filterConfig()"
    (filterApply)="applyFilters($event)"
    (filterReset)="resetFilters()"
    [views]="viewOptions()"
    [view]="viewMode()"
    (viewChange)="viewMode.set($any($event))"
    [table]="plTable() ?? null" />

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
      <span class="material-symbols-outlined text-[18px]">error</span>
      {{ error() }}
    </div>
  }

  <!-- Content sits free in the page — no outer container card (same as the cost approval queue).
       Both views render the same `rows()`: the cards are just another layout of the table. -->
  @if (viewMode() === 'grid') {
    <app-pl-period-cards-section data-guide="reporting-list"
      [periodRows]="rows()"
      [loading]="loading()"
      [emptyMessage]="'REPORTING.EMPTY' | translate"
      (open)="onRowClick($event)"
      (close)="openClosePeriod($event)"
      (generate)="onGenerate($event)" />
  } @else {
  <daf-data-table data-guide="reporting-list"
    [columns]="columns()"
    [rows]="rows()"
    [config]="config()"
    (rowClick)="onRowClick($event)">

    <!-- EBITDA % — red when the month lost money. -->
    <ng-template dafCell="ebitdaPct" let-row>
      <span [class.text-danger]="row['_ebitdaNegative']" [class.font-semibold]="row['_ebitdaNegative']">
        {{ row['ebitdaPct'] }}
      </span>
    </ng-template>

  </daf-data-table>
  }

  <!-- Modal body for `openCreatePeriod()` — country (pre-filled with the page's) + year + month. -->
  <ng-template #newPeriodTpl>
    <div class="flex flex-col gap-4">
      @if (createPeriodError()) {
        <div class="flex items-center gap-2 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">
          <span class="material-symbols-outlined text-[18px]">error</span>
          {{ createPeriodError() }}
        </div>
      }
      <daf-select
        [options]="newPeriodPaysOptions()"
        [selected]="newPeriodPaysId() ? [newPeriodPaysId().toString()] : []"
        [config]="{ label: ('REPORTING.PAYS.LABEL' | translate),
                    placeholder: ('REPORTING.PAYS.SEARCH' | translate), searchable: true }"
        [ariaLabel]="'REPORTING.PAYS.LABEL' | translate"
        (selectedChange)="onNewPeriodPaysSelected($event)" />
      <daf-select
        [options]="newPeriodYearOptions()"
        [selected]="[newPeriodYear().toString()]"
        [ariaLabel]="'REPORTING.NEW_PERIOD_YEAR' | translate"
        (selectedChange)="onNewPeriodYearSelected($event)" />
      <daf-select
        [options]="newPeriodMonthOptions()"
        [selected]="[newPeriodMonth().toString()]"
        [ariaLabel]="'REPORTING.NEW_PERIOD_MONTH' | translate"
        (selectedChange)="onNewPeriodMonthSelected($event)" />
    </div>
  </ng-template>

  <!-- Modal body for `openClosePeriod()` — the waterfall's 5 manual inputs, all optional. -->
  <ng-template #closePeriodTpl>
    <div class="flex flex-col gap-4">
      <p class="text-body-sm text-on-surface-variant">
        {{ 'REPORTING.CLOSE_PERIOD_HELP' | translate }}
      </p>
      <daf-form-field
        [options]="{ type: 'number', label: ('REPORTING.CLOSE_PERIOD_INTERCOMPANY_IN' | translate) }"
        [value]="closeIntercompanyInbound()"
        (valueChange)="closeIntercompanyInbound.set($event === null || $event === '' ? null : +$event)" />
      <daf-form-field
        [options]="{ type: 'number', label: ('REPORTING.CLOSE_PERIOD_INTERCOMPANY_OUT' | translate) }"
        [value]="closeIntercompanyOutbound()"
        (valueChange)="closeIntercompanyOutbound.set($event === null || $event === '' ? null : +$event)" />
      <daf-form-field
        [options]="{ type: 'number', label: ('REPORTING.CLOSE_PERIOD_INTERSEDE_IN' | translate) }"
        [value]="closeIntersedeInbound()"
        (valueChange)="closeIntersedeInbound.set($event === null || $event === '' ? null : +$event)" />
      <daf-form-field
        [options]="{ type: 'number', label: ('REPORTING.CLOSE_PERIOD_INTERSEDE_OUT' | translate) }"
        [value]="closeIntersedeOutbound()"
        (valueChange)="closeIntersedeOutbound.set($event === null || $event === '' ? null : +$event)" />
      <daf-form-field
        [options]="{ type: 'number', label: ('REPORTING.CLOSE_PERIOD_WIP_PRIOR' | translate) }"
        [value]="closeWipPreviousYears()"
        (valueChange)="closeWipPreviousYears.set($event === null || $event === '' ? null : +$event)" />
      <daf-form-field
        [options]="{ type: 'number', label: ('REPORTING.CLOSE_PERIOD_SALARY_RECHARGES' | translate) }"
        [value]="closeSalaryRecharges()"
        (valueChange)="closeSalaryRecharges.set($event === null || $event === '' ? null : +$event)" />
      <daf-form-field
        [options]="{ type: 'number', label: ('REPORTING.CLOSE_PERIOD_OTHER_COST_RECHARGES' | translate) }"
        [value]="closeOtherCostRecharges()"
        (valueChange)="closeOtherCostRecharges.set($event === null || $event === '' ? null : +$event)" />
      <daf-form-field
        [options]="{ type: 'number', label: ('REPORTING.CLOSE_PERIOD_AVERAGE_FTE' | translate), hint: ('REPORTING.CLOSE_PERIOD_AVERAGE_FTE_HINT' | translate) }"
        [value]="closeAverageFte()"
        (valueChange)="closeAverageFte.set($event === null || $event === '' ? null : +$event)" />
    </div>
  </ng-template>

</daf-page>

<!-- Guide de la page, lancé par « Aide & guides » ou la bulle « Première visite ? ». -->
<app-page-guide storageKey="reporting" [steps]="guideSteps" />
